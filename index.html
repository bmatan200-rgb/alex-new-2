<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Alex טיפוח ויופי | קביעת תור ללק ג'ל</title>
    <meta name="description" content="קביעת תורים אונליין ללק ג'ל - Alex טיפוח ויופי" />
    
    <!-- Mobile & Native App (Capacitor / PWA / iOS / Android) Readiness -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Alex Beauty" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      const pwaTenant = new URLSearchParams(window.location.search).get('tenant');
      const pwaManifest = document.querySelector('link[rel="manifest"]');
      const pwaPath = window.location.pathname;
      const pwaSuperAdmin = pwaPath === '/super-admin' || pwaPath.startsWith('/super-admin/');
      const pwaAdmin = pwaPath === '/admin' || pwaPath.startsWith('/admin/');
      const pwaParams = new URLSearchParams();
      if (pwaSuperAdmin) pwaParams.set('app', 'super-admin');
      else {
        if (pwaAdmin) pwaParams.set('app', 'admin');
        if (pwaTenant) pwaParams.set('tenant', pwaTenant);
      }
      if (pwaManifest) pwaManifest.href = `/manifest.json${pwaParams.size ? '?' + pwaParams.toString() : ''}`;
      if (pwaSuperAdmin || pwaAdmin) {
        const pwaTitle = pwaSuperAdmin ? 'סופר אדמין' : 'ניהול העסק';
        document.title = pwaTitle;
        document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', pwaTitle);
        if (pwaSuperAdmin) document.querySelector('link[rel="apple-touch-icon"]').href = '/pwa-super-admin-192x192.png';
        else document.querySelector('link[rel="apple-touch-icon"]')?.remove();
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Frank+Ruhl+Libre:wght@400;500;700;800&family=Heebo:wght@300;400;500;600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f8f9fa] text-[#1e293b] font-['Heebo',sans-serif] antialiased selection:bg-[#fef3c7] selection:text-[#92400e] overscroll-y-contain">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
